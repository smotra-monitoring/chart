apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Values.targetNamespace }}
  labels:
    {{- include "test.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
        host: 0.0.0.0
        port: {{ .Values.service.targetPort }}
        read_timeout: 30s
        write_timeout: 30s
        idle_timeout: 2m0s
        shutdown_timeout: 30s
        environment: production
    database_type: postgres
    postgres_config:
        config:
            type: postgres
            maxopenconns: 100
            maxidleconns: 20
            connmaxlifetime: 15m0s
            connmaxidletime: 5m0s
        host: {{ .Values.db.host }}
        port: {{ .Values.db.port }}
        username: {{ .Values.db.username }}
        password: {{ .Values.db.password }}
        database: {{ .Values.db.database }}
        sslmode: {{ .Values.db.sslmode }}
    logging:
        level: warn
        format: json
    auth:
        frontend_callback_url: https://www.smotra.net/auth/callback
        server_callback_url: https://api.smotra.net/v1/auth/oauth2/callback
        providers:
            auth0:
                type: oidc
                client_id: ZPsNwOIn7DiPHEjhbfy8zkXDj1hl0BD6
                issuer_url: https://dev-7ffv2mlfow4w0de7.us.auth0.com/
            # Example: configure GitHub for local dev
            # github:
            #     type: static
            #     client_id: your-github-client-id
            # Example: configure Google OIDC
            # google:
            #     type: oidc
            #     issuer_url: https://accounts.google.com
            #     client_id: your-google-client-id
    agent:
        claim_token_expiration_hours: 24
        server_url: https://smotra.net
        claim_poll_initial_interval_secs: 5
        claim_poll_increment_secs: 5
        claim_poll_max_interval_secs: 30
    cors:
        origin: https://www.smotra.net