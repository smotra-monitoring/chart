apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Values.targetNamespace }}
  labels:
    {{- include "test.labels-db" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "test.selectorLabels-db" . | nindent 4 }}
  ports:
    - port: 8080
      name: http
      targetPort: http