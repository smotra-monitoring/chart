apiVersion: v1
kind: Service
metadata:
  name: http-limiter
  namespace: {{ .Values.targetNamespace }}
  labels:
    {{- include "test.labels-http-limiter" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "test.selectorLabels-http-limiter" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8082