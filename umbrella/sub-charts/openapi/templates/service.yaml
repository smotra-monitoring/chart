apiVersion: v1
kind: Service
metadata:
  name: {{ include "test.fullname" . }}
  namespace: {{ .Values.targetNamespace }}
  labels:
    {{- include "test.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "test.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      name: http
      targetPort: {{ .Values.service.targetPort }}